# git-cliff configuration for norma.
#
# Regenerates CHANGELOG.md automatically from the full git history on every
# push to `main` -- i.e. whenever a PR from `develop` is merged -- see
# .github/workflows/changelog.yml. Not restricted to strict Conventional
# Commits: this repo's early history predates that convention (module-
# prefixed messages like `norma:`/`mcp_server:`/`README:`, and the
# `wayfinder:` design-decision commits), so `commit_parsers` below groups
# those explicitly and funnels everything else into a catch-all group
# rather than silently dropping commits that don't match `feat:`/`fix:`.
#
# No semver/Cargo.toml-version release process exists, so this doesn't
# tag `vX.Y.Z`-style versions. Instead, `.github/workflows/changelog.yml`
# tags every push to `main` with a date-based release tag (`v2026.09.22`,
# or `v2026.09.22.2` for a second release the same day) *before* running
# git-cliff -- so everything already merged into `main` renders under a
# real dated section instead of "Unreleased" (which would otherwise be
# misleading: code on `main` has shipped, it isn't pending). Only
# `develop` (pre-release integration work) still accumulates under
# "Unreleased" until it's actually merged into `main`.

[changelog]
header = """
# Changelog

All notable changes to this project. Generated automatically by
[git-cliff](https://github.com/orhun/git-cliff) from the commit history on
every merge to `main` -- **do not edit by hand**, changes will be
overwritten on the next merge.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | trim | upper_first }}
    {% for commit in entry.commits %}
        - {{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/talent-factory/norma/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""

[git]
# Parse `type: description` where present, but never hard-fail or drop a
# commit that doesn't use it -- see the module-header comment above.
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false

commit_preprocessors = [
  # Link a "(TF-123)" Linear ticket reference in a commit subject.
  { pattern = '\(TF-(\d+)\)', replace = "([TF-${1}](https://linear.app/talent-factory/issue/TF-${1}))" },
]

# Order here is also the changelog's section order (see `commit_groups` in
# the body template above) -- first match wins, so the catch-all `.*` at
# the end must stay last.
commit_parsers = [
  { message = "^Merge pull request", skip = true },
  { message = "^Merge branch", skip = true },
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^(📚 ?)?docs", group = "📚 Documentation" },
  { message = "^README", group = "📚 Documentation" },
  { message = "^wayfinder", group = "🧭 Design Decisions" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^test", group = "✅ Testing" },
  { message = "^chore", group = "🔧 Chores" },
  { message = ".*", group = "🔩 Other Changes" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
