# rule-packs/rust-style-guide/rust.yaml
#
# Rules derived from the official Rust Style Guide
# (https://doc.rust-lang.org/nightly/style-guide/), (c) The Rust Project
# Contributors, licensed under MIT OR Apache-2.0
# (https://github.com/rust-lang/rust, see COPYRIGHT). Paraphrased, not
# copied; each rule's `note` names the guide section.
#
# The guide is almost entirely layout, which rustfmt already enforces,
# and its naming rules are covered by default-on rustc lints
# (`non_snake_case`, `non_camel_case_types`, `non_upper_case_globals`).
# This pack only holds the gaps that neither rustfmt, rustc nor a
# default-on Clippy lint checks: item ordering, `macro_rules!` naming and
# delimiters, empty-struct form, doc-comment form and placement, comment
# spacing, `#[path]`.
#
# The guide describes the default style and does not forbid deviations,
# so this pack is stricter than its source; treat hits as style hints.
#
# Overlaps with other packs, built once elsewhere:
#   - glob imports, one-module-per-`use`
#       -> google-rust-style: google-no-glob-import-rust,
#          google-use-one-module-per-use-rust
#   - import sorting/normalisation and layout: rustfmt
#
# Import with: norma import rule-packs/rust-style-guide --category rust-style-guide
---
id: style-macro-name-snake-case-rust
language: Rust
severity: warning
message: >-
  `macro_rules!` names should be snake_case.
note: >-
  Official Rust Style Guide, "Advice > Names". rustc `non_snake_case`
  does not check macro names, and Clippy has no default-on lint for it.
rule:
  kind: macro_definition
  has: { field: name, not: { regex: '^[a-z_][a-z0-9_]*$' } }
---
id: style-macro-rules-curly-braces-rust
language: Rust
severity: warning
message: >-
  Define `macro_rules!` with curly braces: `macro_rules! name { .. }`.
note: >-
  Official Rust Style Guide, "Items > macro_rules!". rustfmt leaves the
  `()`/`[]` forms untouched. Decided on the definition text because the
  delimiters are anonymous tokens that ast-grep cannot select by kind.
rule:
  kind: macro_definition
  regex: '^macro_rules!\s+[A-Za-z0-9_]+\s*[(\[]'
---
id: style-unit-struct-no-empty-brackets-rust
language: Rust
severity: hint
message: >-
  Empty struct written with brackets. Declare a unit struct as
  `struct Name;`.
note: >-
  Official Rust Style Guide, "Items > Structs and unions" and "Tuple
  structs". The guide tolerates the bracketed form for generated code.
  Clippy `empty_structs_with_brackets` is restriction.
rule:
  kind: struct_item
  has:
    any:
      - kind: field_declaration_list
        regex: '^\{\s*\}$'
      - kind: ordered_field_declaration_list
        regex: '^\(\s*\)$'
---
id: style-doc-comment-before-attributes-rust
language: Rust
severity: warning
message: >-
  Outer doc comment placed after an attribute. Put `///` doc comments
  before the attributes of the item.
note: >-
  Official Rust Style Guide, "Doc comments". Neither rustfmt nor Clippy
  checks the order. Only the first doc line directly after an attribute
  is reported. A trailing `//` comment on the attribute's line hides the
  problem from this rule.
rule:
  kind: line_comment
  has: { field: outer, kind: outer_doc_comment_marker }
  follows: { kind: attribute_item }
---
id: style-doc-comment-line-style-rust
language: Rust
severity: warning
message: >-
  Block doc comment (`/** */` or `/*! */`). Use `///` and `//!` line
  doc comments.
note: >-
  Official Rust Style Guide, "Doc comments". rustfmt does not rewrite
  block doc comments by default (`normalize_comments` is nightly-only
  and off).
rule:
  kind: block_comment
  any:
    - has: { field: outer, kind: outer_doc_comment_marker }
    - has: { field: inner, kind: inner_doc_comment_marker }
---
id: style-comment-space-after-slashes-rust
language: Rust
severity: hint
message: >-
  Put a space after `//` at the start of a comment.
note: >-
  Official Rust Style Guide, "Comments". Doc comments (`///`, `//!`) and
  banners (`////`) are not flagged. Commented-out code written as
  `//foo();` is flagged too; that is noisy but matches the guide.
rule:
  kind: line_comment
  regex: '^//[^ /!\n]'
---
id: style-no-path-attribute-rust
language: Rust
severity: hint
message: >-
  `#[path = ".."]` overrides the module file location. Prefer the
  standard module layout.
note: >-
  Official Rust Style Guide, "Advice > Modules". Platform-specific
  module selection is a legitimate use, hence hint severity. Clippy
  module-layout lints are restriction.
rule:
  kind: attribute_item
  regex: '^#\[\s*path\s*='
---
id: style-extern-crate-first-rust
language: Rust
severity: warning
message: >-
  `extern crate` must come first in the file, before any other item.
note: >-
  Official Rust Style Guide, "Items" (introduction). rustfmt only sorts
  within a group and does not move `extern crate` above other items.
  Attributes and comments before it are fine.
rule:
  kind: extern_crate_declaration
  follows:
    stopBy: end
    all:
      - regex: '(?s).*'
      - not:
          any:
            - kind: extern_crate_declaration
            - kind: attribute_item
            - kind: inner_attribute_item
            - kind: line_comment
            - kind: block_comment
---
id: style-use-before-other-items-rust
language: Rust
severity: info
message: >-
  `use` declaration after other items. Put imports before functions,
  types, impls and inline modules.
note: >-
  Official Rust Style Guide, "Items" (introduction). Applies to module
  level only; `use` inside function bodies is not checked. `macro_rules!`
  definitions and macro invocations before a `use` are not counted as
  items, because they are often legitimately placed first.
rule:
  kind: use_declaration
  inside:
    any:
      - kind: source_file
      - kind: declaration_list
  follows:
    stopBy: end
    any:
      - kind: function_item
      - kind: struct_item
      - kind: enum_item
      - kind: union_item
      - kind: trait_item
      - kind: impl_item
      - kind: const_item
      - kind: static_item
      - kind: type_item
      - kind: foreign_mod_item
      - kind: mod_item
        has: { kind: declaration_list }
---
id: style-imports-before-mod-declarations-rust
language: Rust
severity: info
message: >-
  `use` declaration after a `mod name;` declaration. Put imports before
  module declarations.
note: >-
  Official Rust Style Guide, "Items" (introduction). Module declarations
  marked `#[macro_use]` are exempt, as the guide says they must not be
  moved. Common in lib.rs/main.rs files that declare modules first; this
  pack follows the guide's order.
rule:
  kind: use_declaration
  inside:
    any:
      - kind: source_file
      - kind: declaration_list
  follows:
    stopBy: end
    kind: mod_item
    not:
      any:
        - has: { kind: declaration_list }
        - follows: { kind: attribute_item, regex: macro_use }
