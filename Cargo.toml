[package]
name = "norma"
version = "0.1.0"
edition = "2021"
authors = ["Talent Factory GmbH <daniel.senften@talent-factory.ch>"]
description = "Developer-grade code pattern enforcement everywhere you code"
repository = "https://github.com/talent-factory/norma"
license = "MIT OR Apache-2.0"

[lib]
name = "norma"
path = "src/lib.rs"

[[bin]]
name = "norma"
path = "src/main.rs"

[dependencies]
# MCP server framework: official Rust SDK (see docs/adr/0001.md and ticket 01).
rmcp = { version = "3", features = ["server", "transport-io", "schemars"] }
schemars = "1"

# AST-based pattern matching (see docs/adr/0002.md and tickets 02/04).
# Pinned *exactly*: ast-grep's own docs say the Rust API is "not stable
# yet". Bump these three together, deliberately, after testing -- never
# let a caret range silently pull in a breaking update.
ast-grep-core = "=0.45.3"
ast-grep-config = "=0.45.3"
ast-grep-language = "=0.45.3"

# Async runtime.
tokio = { version = "1", features = ["full"] }

# CLI (see docs/adr/0001.md: one binary, clap subcommands).
clap = { version = "4", features = ["derive"] }

# Data serialization.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already pulled in transitively by ast-grep-config (pinned above); made
# explicit here since `pattern_store::import_rules` (TF-894) needs to split
# a multi-document YAML string into its individual documents itself --
# `ast_grep_config::from_yaml_string` does that internally but only
# surfaces the parsed `RuleConfig`s, not each document's own raw text.
# Note: the crate itself is archived/unmaintained upstream (RUSTSEC-2024-0320)
# -- zero *added* risk today since ast-grep-config already pulls the exact
# same version transitively, but worth knowing before adding a second,
# independent use of it elsewhere.
serde_yaml = "0.9"

# Database.
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono"] }

# Error handling & logging.
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Time.
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
