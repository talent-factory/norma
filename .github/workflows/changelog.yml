name: Changelog

# Regenerates CHANGELOG.md from the full commit history whenever `main`
# moves -- in practice, whenever a PR from `develop` is merged (GitHub's
# merge button pushes a merge commit to `main`, which is exactly a `push`
# event on this branch; there's no separate "PR merged" trigger needed).
#
# `paths-ignore` on the trigger, not just a run-time guard, is what stops
# this workflow's own PR (touching only CHANGELOG.md) from triggering
# itself again -- GitHub skips *starting* the workflow for a push that only
# touches ignored paths, so there's no infinite loop to guard against
# inside the job at all.
on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
  # Lets a maintainer force a regeneration on demand (e.g. after editing
  # cliff.toml) without needing an actual push to `main`.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # git-cliff needs the full history, not just the latest commit,
          # to build the changelog from every commit ever made.
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md

      - name: Open and merge a PR with the updated CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: regenerate CHANGELOG.md via git-cliff"

          # `main`/`develop` are both protected (PR-only, though 0
          # approvals/status checks are required) -- the workflow's own
          # GITHUB_TOKEN isn't on the push-restriction allowlist, so a
          # direct `git push` here is rejected ("GH006: Protected branch
          # update failed"). Opening a single-file PR from a dedicated
          # branch and merging it immediately works within that
          # restriction instead. Fixed branch name + `--force`
          # (create-or-reset) so a leftover branch from an earlier failed
          # run doesn't pile up or go stale.
          branch="changelog/auto-update"
          git push --force origin "HEAD:refs/heads/$branch"

          pr_number=$(gh pr list --head "$branch" --base "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            # Unlike `gh pr list`/`gh pr view`, `gh pr create` has no
            # --json/--jq output mode -- on success it just prints the new
            # PR's URL, so the number is extracted from that instead.
            pr_url=$(gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "docs: regenerate CHANGELOG.md via git-cliff" \
              --body "Automated update -- see .github/workflows/changelog.yml.")
            pr_number="${pr_url##*/}"
          fi
          gh pr merge "$pr_number" --merge --delete-branch
